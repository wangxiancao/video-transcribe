# video-transcribe configuration schema.
# Copy to config.yaml. The pipeline reads but never writes this file.

# External OpenAI-compatible fallback, used only when llm.local.enabled=false.
api:
  key: 'your-api-key'
  base_url: 'https://api.deepseek.com'
  model: 'deepseek-v4-flash'

# Concurrent translation batches. Use 1 for a single local model replica.
max_workers: 4

# Managed local translation service. No cloud fallback when startup fails.
llm:
  local:
    enabled: true
    # llamacpp: Q4_K_M GGUF; transformers: BF16 FastAPI fallback.
    runtime: 'llamacpp'
    replicas: 1
    gguf_path: '_model_cache/HY-MT2-1.8B-GGUF/Hy-MT2-1.8B-Q4_K_M.gguf'
    binary: 'native/llamacpp/llama.cpp/build/bin/llama-server'
    model_dir: '_model_cache/HY-MT2-1.8B'
    # Bounded subtitle-serving context; large defaults allocate excessive KV cache.
    ctx: 4096
    # Q4 is most reliable with 1..2 segments per request; transformers supports 12.
    batch_segments: 1
    host: '127.0.0.1'
    # 0 selects free ports automatically.
    port: 0
    startup_timeout_s: 180

# Deterministic sentence segmentation; no LLM calls.
segmentation:
  pause_s: 0.45
  max_words: 20
  max_duration_s: 8.0
  # Drop standalone fillers and pathological repetition before translation.
  filter_low_information: true

target_language: '简体中文'

# GLM-ASR + Qwen3-ForcedAligner. Weights must be downloaded before running.
asr:
  backend: 'glm_asr_native'  # glm_asr_native or glm_asr (transformers fallback)
  native_binary: 'native/asr/build/glm_asr_m0'
  # auto detects zh/en/ja/ko/ru; an ISO code overrides detection.
  language: 'auto'
  chunk_seconds: 30
  # glm_asr only; the stage halves the batch on CUDA OOM.
  batch_size: 20
  max_new_tokens: 512
  modelscope_cache: '~/.cache/modelscope'

# Burn target.srt. chunks must be 1..8.
burn:
  encoder: 'libx264'  # libx264 or h264_nvenc
  chunks: 4

youtube:
  # Used only when downloading a URL and the file exists.
  cookies_path: ''

subtitle:
  max_length: 75
  target_multiplier: 1.2
  min_duration: 0.5
  max_duration: 10.0

translation:
  batch_size: 12
  cache: true
  # Used only if language detection from the transcript fails.
  source_language: 'auto'
  # Normalize known ASR garbles in LLM requests; stored sources stay raw.
  term_map:
    '匹秒': '皮秒'
    '匹苗': '皮秒'

# Dubbing synthesis (ADR-0003/0004). The tts stage runs only with an explicit
# `--stages tts`; the six-stage default never synthesizes speech.
tts:
  # Voice name from the library manifest (voices.json next to the clips).
  voice: 'zh-female-01'
  # Which translation.json field to speak: 'translated' (target) or 'source'.
  input: 'translated'
  # Cache synthesized segments (voice+text+speed keyed) under <workdir>/.tts-cache.
  cache: true
  # Named-voice library directory holding voices.json and the reference clips.
  voices_dir: '_model_cache/tts_voices'
